# relay — прод-стек. Единая точка входа из корня репо:
#
#   docker compose up --build
#
# С TURN-ретранслятором (нужен для звонков между строгими NAT):
#
#   docker compose --profile turn up --build
#
# Открыть: https://localhost (self-signed internal CA Caddy) или https://$DOMAIN.
#
# .env в корне репо:
#   SITE_PASSWORD=секрет          # пароль на вход
#   POSTGRES_PASSWORD=секрет      # обязателен: база — часть стека, дефолта нет
#   DOMAIN=example.com            # пусто → localhost (internal CA Caddy)
#   SERVER_HOST=example.com       # для ICE-конфига и realm coturn
#   TURN_CREDENTIAL=...           # обязателен при --profile turn
#   TURN_EXTERNAL_IP=1.2.3.4      # публичный IP на облачных VM за 1:1 NAT
#
# Архитектура: Caddy (единый origin, TLS) → api (NestJS :3000) + web (Next.js :3001).
# Dev-стек с hot-reload:  docker compose -f infra/docker-compose.dev.yml up

name: relay

services:
  # Postgres — постоянное хранилище: история чата, реестр серверов и каналов,
  # личности. Обязательный сервис стека, а не профиль: api без базы не работает.
  #
  # Настройки подобраны под самую маленькую VM, на какой relay реально стоит
  # (1 ядро, ~1 ГБ, и эту память делят Caddy, api, web, sfu и coturn). Дефолты
  # postgres рассчитаны на машину, где база — единственный жилец.
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=relay
      - POSTGRES_DB=relay
      # Дефолта нет намеренно: дефолтный пароль в прод-стеке — это один и тот же
      # пароль у всех. Порт наружу не публикуется, но сеть compose видят все
      # контейнеры стека, и «изнутри и так свои» — не рубеж.
      #
      # ВАЖНО: initdb читает пароль ровно один раз, при создании тома. Смена
      # значения в .env потом ничего не меняет в базе — только ломает вход api.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан. Допишите в .env длинную случайную строку (openssl rand -hex 24). На установленном relay это делает relay update.}
    command:
      - postgres
      # Кэш страниц базы. Дефолт 128 МБ — восьмая часть всей памяти машины,
      # отданная одному сервису из шести.
      - -c
      - shared_buffers=64MB
      # Сколько всего кэша (своего и файлового) планировщик считает доступным.
      # Не выделяет память, только влияет на выбор индексного плана.
      - -c
      - effective_cache_size=192MB
      - -c
      - maintenance_work_mem=32MB
      # api — один процесс с пулом; остаток запаса на relay backup и psql руками.
      # Каждое соединение стоит памяти, поэтому сотня по умолчанию здесь лишняя.
      - -c
      - max_connections=30
      # Одно ядро: параллельный план не ускоряет, а добавляет процессов и
      # трафика через разделяемую память (её в контейнере всего 64 МБ).
      - -c
      - max_parallel_workers_per_gather=0
      # Потолок WAL между контрольными точками. Дефолт 1 ГБ на диске, который
      # делится с загрузками и образами docker, — это гигабайт, отложенный молча.
      - -c
      - max_wal_size=512MB
      - -c
      - min_wal_size=80MB
      # VM с SSD: случайное чтение почти не дороже последовательного.
      - -c
      - random_page_cost=1.1
    # -h 127.0.0.1, а не сокет: initdb поднимает временный сервер с
    # listen_addresses='', и проба по unix-сокету скажет «готов» посреди
    # инициализации — api пойдёт в базу, которой ещё нет, и упадёт на старте.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U relay -d relay"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      # Том на весь /var/lib/postgresql, а не на .../data: у образов 18+ PGDATA
      # лежит в версионном подкаталоге (/var/lib/postgresql/18/docker), и это же
      # разделение делает будущий мажорный pg_upgrade возможным на месте.
      - pgdata:/var/lib/postgresql
    expose:
      - "5432"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=3000
      - UPLOAD_DIR=/app/uploads
      # Реестр серверов/каналов — на persistent-том uploads (подпапка state/),
      # чтобы серверы пользователей переживали рестарт/пересборку контейнера.
      - DATA_DIR=/app/uploads/state
      # Строка подключения к базе. Собирается из пароля выше — задавать её
      # целиком нужно только если база вынесена наружу стека или если пароль
      # выбран руками и содержит символы, которые в URL значат другое (@ / : ?).
      - DATABASE_URL=${DATABASE_URL:-postgresql://relay:${POSTGRES_PASSWORD}@db:5432/relay}
      # Сколько дней живут сообщения и их вложения. 0 — не хранить вовсе.
      - RETENTION_DAYS=${RETENTION_DAYS:-14}
      # Потолок на весь каталог загрузок; пусто — встроенный дефолт (2 ГиБ).
      # За потолком вытесняются самые старые вложения: том общий с реестром и
      # сертификатами, и кончиться он не должен. Принимает 2G / 512M / байты.
      - UPLOAD_MAX_TOTAL_BYTES=${UPLOAD_MAX_TOTAL_BYTES:-}
      - SITE_PASSWORD=${SITE_PASSWORD:-}
      - SERVER_HOST=${SERVER_HOST:-localhost}
      - STUN_URLS=${STUN_URLS:-}
      - TURN_URLS=${TURN_URLS:-}
      - TURN_USERNAME=${TURN_USERNAME:-webrtc}
      - TURN_CREDENTIAL=${TURN_CREDENTIAL:-}
      # Секрет временных учёток TURN: api подписывает им выдачу, coturn
      # проверяет подпись. Одна переменная на обе стороны — иначе они
      # разъедутся, и разъедутся молча (см. apps/api/src/turn.ts).
      - TURN_SECRET=${TURN_SECRET:-}
      # Медиасервер: включается заданием SFU_SECRET (тот же ключ, что у сервиса
      # sfu) — без него api не выдаст ни одного пропуска и режим SFU в интерфейсе
      # останется выключенным. SFU_URL по умолчанию «тот же origin»: сигналинг
      # медиасервера ходит через Caddy на /sfu/.
      - SFU_URL=${SFU_URL:-/}
      - SFU_SECRET=${SFU_SECRET:-}
      # Внутренний адрес медиасервера для health-пинга: sfu живёт в host-сети
      # (см. ниже), доменное имя compose-сети на него больше не указывает.
      - SFU_INTERNAL_URL=${SFU_INTERNAL_URL:-http://host.docker.internal:3100}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Зависший (не упавший) процесс `restart: unless-stopped` не замечает:
    # повисший цикл событий в HTTP не отвечает. Healthcheck делает это
    # зависание видимым (`docker ps` → unhealthy, внешний мониторинг) —
    # перезапуск повисшего остаётся за оркестратором, сам compose его не
    # лечит. /api/health публичен (без куки), версии не отдаёт (audit S7).
    #
    # Адрес числом, а не `localhost`: busybox-wget (это он в alpine) сначала
    # пробует ::1, и служба, слушающая только IPv4, для пробы не существует.
    # api слушает :: и уцелел бы, web — нет; одинаково пишем 127.0.0.1.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - uploads:/app/uploads
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # Гейт доступа — в Next middleware; ему нужен тот же SITE_PASSWORD, что и
      # api, иначе verifyToken не сойдётся с выданной кукой relay_pass.
      - SITE_PASSWORD=${SITE_PASSWORD:-}
    expose:
      - "3001"
    # Как у api: /login отдаётся без авторизации (сама страница входа) —
    # это и есть доступный health-пробе web (audit S7). Next standalone
    # слушает 0.0.0.0 (HOSTNAME выше), то есть только IPv4, — адрес числом
    # здесь не педантизм, а условие того, что проба вообще достучится.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Медиасервер (SFU): звонки на 4+ человек с видео. Без него всё работает на
  # p2p (mesh) — поэтому профиль опциональный, как у coturn.
  #
  #   docker compose --profile sfu up --build
  #
  # На фаерволе нужно открыть диапазон RTC-портов (по умолчанию 40000-40100,
  # UDP и TCP) и задать SFU_SECRET — общий с api ключ подписи пропусков.
  sfu:
    build:
      context: .
      dockerfile: apps/sfu/Dockerfile
    profiles: ["sfu"]
    # Host-сеть вместо проброса диапазона: на сотню RTC-портов docker поднимал
    # сотни userland-прокси (процесс на порт×протокол×семейство) и гнал каждый
    # RTP-пакет через DNAT — на слабой VM это заметный CPU и лишняя точка отказа
    # посреди звонка. Как у coturn ниже — медиасерверу место в host-сети.
    # Сигналинг при этом слушает 3100 прямо на хосте: наружу его открывать НЕ
    # нужно (Caddy ходит к нему изнутри, см. SFU_UPSTREAM), в фаерволе достаточно
    # RTC-диапазона 40000-40100 (UDP и TCP).
    network_mode: host
    restart: unless-stopped
    environment:
      - PORT=3100
      - SFU_SECRET=${SFU_SECRET:-}
      - SERVER_HOST=${SERVER_HOST:-localhost}
      # Адрес в ICE-кандидатах. На облачной VM за 1:1 NAT обязателен публичный
      # IP — иначе клиент получит внутренний адрес и медиа не пойдёт.
      - SFU_ANNOUNCED_IP=${SFU_ANNOUNCED_IP:-${TURN_EXTERNAL_IP:-}}
      - SFU_RTC_MIN_PORT=${SFU_RTC_MIN_PORT:-40000}
      - SFU_RTC_MAX_PORT=${SFU_RTC_MAX_PORT:-40100}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      # DOMAIN пуст → Caddy слушает localhost и выдаёт self-signed (internal CA).
      # Реальный домен → сертификат от Let's Encrypt берётся автоматически.
      - DOMAIN=${DOMAIN:-localhost}
      # Апстрим сигналинга медиасервера: sfu в host-сети (см. сервис sfu),
      # из compose-сети до него — только через шлюз хоста.
      - SFU_UPSTREAM=host.docker.internal:3100
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      # Переключатель TLS-режима: в репозитории лежит пустой (одни комментарии),
      # и Caddy выбирает выдачу сам по имени хоста. Непустым его делает только
      # install.sh — когда сертификат берётся на голый IP.
      - ./infra/tls-mode.caddy:/etc/caddy/tls-mode.caddy:ro
      - caddy_data:/data
      - caddy_config:/config

  # TURN-ретранслятор: без него звонок между строгими NAT (мобильный интернет,
  # CGNAT, корпоративные сети) не соберётся. host-сеть нужна, чтобы coturn видел
  # реальные адреса и раздал диапазон relay-портов.
  #
  # TURN over TLS на 5349: серт берём из тома Caddy (тот же LE/internal-CA серт,
  # что и у веба) — свой ACME поднимать не нужно. На строгих сетях с DPI, где
  # проходит только TLS, turns:5349 — единственный путь собрать звонок.
  # На фаерволе дополнительно откройте 5349/tcp. Ротацию серта Caddy'ем точка
  # входа отслеживает сама (SIGUSR2, без разрыва сессий) — см. скрипт.
  coturn:
    image: coturn/coturn:4-alpine
    profiles: ["turn"]
    network_mode: host
    restart: unless-stopped
    # Под root: серты Caddy лежат в каталоге 0700 root (приватный ключ 0600) —
    # штатный образный юзер `nobody` их не прочитает, и TLS молча откатится. Root
    # читает как есть, без ослабления прав серта и без поломки авто-ротации.
    user: "0:0"
    depends_on:
      - caddy
    environment:
      - SERVER_HOST=${SERVER_HOST:-localhost}
      - TURN_USERNAME=${TURN_USERNAME:-webrtc}
      - TURN_CREDENTIAL=${TURN_CREDENTIAL:-}
      # Секрет временных учёток TURN: api подписывает им выдачу, coturn
      # проверяет подпись. Одна переменная на обе стороны — иначе они
      # разъедутся, и разъедутся молча (см. apps/api/src/turn.ts).
      - TURN_SECRET=${TURN_SECRET:-}
      - TURN_EXTERNAL_IP=${TURN_EXTERNAL_IP:-}
    volumes:
      # Серты Caddy (read-only) — для TURN over TLS. Тот же том, что пишет caddy.
      - caddy_data:/certs:ro
      # Точка входа вынесена в файл: она ждёт сертификат Caddy на первом старте и
      # перечитывает его при ротации (см. комментарии внутри скрипта).
      - ./infra/coturn-entrypoint.sh:/coturn-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/coturn-entrypoint.sh"]

volumes:
  uploads:
  pgdata:
  caddy_data:
  caddy_config:
