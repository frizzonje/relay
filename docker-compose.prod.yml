# relay — self-host stack on prebuilt GHCR images (no source build).
#
# This is what install.sh deploys: it downloads this file + Caddyfile + .env
# into /opt/relay and runs `docker compose up -d`. Nothing is compiled on the
# server — api/web are pulled from ghcr.io. To build from source instead, use
# the repo's docker-compose.yml (build: context).
#
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml --profile turn up -d   # with TURN
#   docker compose -f docker-compose.prod.yml --profile sfu up -d    # + media server
#
# The release is pinned in .env — install.sh writes RELAY_VERSION there and
# `relay update` moves it. Driving compose by hand, set it yourself:
#   RELAY_VERSION=0.4.0 docker compose -f docker-compose.prod.yml up -d
# Unset means :latest, which moves under you on every release — fine for a test
# box, not for anything people rely on. Images are pulled on demand, so ask for
# new ones explicitly: `relay update`, or `docker compose pull`.
#
# Config comes from .env in the same directory (SITE_PASSWORD, POSTGRES_PASSWORD,
# DOMAIN, SERVER_HOST, TURN_CREDENTIAL, TURN_EXTERNAL_IP, SFU_SECRET).

name: relay

services:
  # Postgres — the persistent store: chat history, the server/channel registry,
  # identities. A required service, not a profile: api does not run without it.
  #
  # Tuned for the smallest VM relay actually gets installed on (1 core, ~1 GB,
  # shared with Caddy, api, web, sfu and coturn). Postgres ships defaults for a
  # machine where the database is the only tenant.
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=relay
      - POSTGRES_DB=relay
      # No default on purpose: a default password in a production stack is the
      # same password on every installation. The port is never published, but
      # every container on the compose network can reach it, so "we're all
      # inside anyway" is not a boundary.
      #
      # NOTE: initdb reads this exactly once, when the volume is created.
      # Changing it later does not change the database — it only breaks api's
      # login. To rotate it: ALTER USER relay PASSWORD, then update .env.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Add a long random string to .env (openssl rand -hex 24), or run `relay update`, which generates one.}
    command:
      - postgres
      # Page cache. The 128 MB default is an eighth of the whole machine handed
      # to one service out of six.
      - -c
      - shared_buffers=64MB
      # How much cache (its own plus the OS page cache) the planner assumes is
      # available. Allocates nothing; it only steers index-vs-scan choices.
      - -c
      - effective_cache_size=192MB
      - -c
      - maintenance_work_mem=32MB
      # api is a single process with a pool; the rest is headroom for `relay
      # backup` and a psql session. Connections cost memory, so the default 100
      # is nothing but a way to run out of it.
      - -c
      - max_connections=30
      # One core: a parallel plan buys no speed and costs processes plus traffic
      # through shared memory (64 MB in a container by default).
      - -c
      - max_parallel_workers_per_gather=0
      # WAL ceiling between checkpoints. The 1 GB default is a gigabyte quietly
      # reserved on a disk shared with uploads and docker images.
      - -c
      - max_wal_size=512MB
      - -c
      - min_wal_size=80MB
      # SSD-backed VM: a random read costs about as much as a sequential one.
      - -c
      - random_page_cost=1.1
    # -h 127.0.0.1 rather than the socket: initdb starts a temporary server with
    # listen_addresses='', so a unix-socket probe reports "ready" in the middle
    # of initialisation — api then connects to a database that isn't there yet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U relay -d relay"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      # The whole /var/lib/postgresql, not .../data: on 18+ images PGDATA lives
      # in a version subdirectory (/var/lib/postgresql/18/docker), and that same
      # split is what makes a future major pg_upgrade possible in place.
      - pgdata:/var/lib/postgresql
    expose:
      - "5432"

  api:
    image: ghcr.io/frizzonje/relay-api:${RELAY_VERSION:-latest}
    # `missing`, not `always`. install.sh pins RELAY_VERSION to a release number
    # and `relay update` is the one command that moves it — so there is nothing
    # for a re-pull to discover, and `always` only bought two things: a registry
    # round trip on every `up`, and a stack that refuses to start after a reboot
    # while GHCR is down. Paired with the pin it also closes the older half of
    # the same problem: on `:latest` an ordinary `relay up` was an unannounced
    # upgrade, and on release day it would have carried people across a major
    # version without a word (audit B7.2). Fetching new images is now `relay
    # update`, or a plain `docker compose pull` if you drive compose yourself.
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=3000
      - UPLOAD_DIR=/app/uploads
      - DATA_DIR=/app/uploads/state
      # Connection string, assembled from the password above. Set it whole only
      # when the database lives outside this stack, or when a hand-picked
      # password contains characters that mean something else in a URL (@ / : ?).
      - DATABASE_URL=${DATABASE_URL:-postgresql://relay:${POSTGRES_PASSWORD}@db:5432/relay}
      # How many days messages and their attachments live. 0 keeps nothing.
      - RETENTION_DAYS=${RETENTION_DAYS:-14}
      # Ceiling on the whole uploads directory; empty means the built-in default
      # (2 GiB). Past it the oldest attachments are evicted, so the volume — which
      # also holds the registry and Caddy's certificates — cannot be filled up.
      # Accepts 2G / 512M / plain bytes.
      - UPLOAD_MAX_TOTAL_BYTES=${UPLOAD_MAX_TOTAL_BYTES:-}
      - SITE_PASSWORD=${SITE_PASSWORD:-}
      - SERVER_HOST=${SERVER_HOST:-localhost}
      - STUN_URLS=${STUN_URLS:-}
      - TURN_URLS=${TURN_URLS:-}
      - TURN_USERNAME=${TURN_USERNAME:-webrtc}
      - TURN_CREDENTIAL=${TURN_CREDENTIAL:-}
      # Секрет временных учёток TURN: api подписывает им выдачу, coturn
      # проверяет подпись. Одна переменная на обе стороны — иначе они
      # разъедутся, и разъедутся молча (см. apps/api/src/turn.ts).
      - TURN_SECRET=${TURN_SECRET:-}
      # Media server: enabled by SFU_SECRET alone (same key as the sfu service).
      # Empty => api mints no passes and the SFU mode stays disabled in the UI.
      - SFU_URL=${SFU_URL:-/}
      - SFU_SECRET=${SFU_SECRET:-}
      # Internal address for the sfu health ping: sfu runs on the host network
      # (see below), so the compose DNS name no longer points at it.
      - SFU_INTERNAL_URL=${SFU_INTERNAL_URL:-http://host.docker.internal:3100}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Зависший (не упавший) процесс `restart: unless-stopped` не замечает:
    # повисший цикл событий в HTTP не отвечает. Healthcheck делает это
    # зависание видимым (`docker ps` → unhealthy, внешний мониторинг) —
    # перезапуск повисшего остаётся за оркестратором, сам compose его не
    # лечит. /api/health публичен (без куки), версии не отдаёт (audit S7).
    #
    # Адрес числом, а не `localhost`: busybox-wget (это он в alpine) сначала
    # пробует ::1, и служба, слушающая только IPv4, для пробы не существует.
    # api слушает :: и уцелел бы, web — нет; одинаково пишем 127.0.0.1.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - uploads:/app/uploads
    expose:
      - "3000"

  web:
    image: ghcr.io/frizzonje/relay-web:${RELAY_VERSION:-latest}
    pull_policy: missing # see api
    restart: unless-stopped
    environment:
      - SITE_PASSWORD=${SITE_PASSWORD:-}
    expose:
      - "3001"
    # Как у api: /login отдаётся без авторизации (сама страница входа) —
    # это и есть доступный health-пробе web (audit S7). Next standalone
    # слушает 0.0.0.0 (HOSTNAME в образе), то есть только IPv4, — адрес
    # числом здесь не педантизм, а условие того, что проба достучится.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Media server (profile: sfu) — calls of 4+ with video: everyone uploads their
  # video once to the server instead of once per peer. Without it everything
  # still works over p2p (mesh), just with a ceiling of 2-3 videos.
  # Firewall: open the RTC range 40000-40100, both UDP and TCP.
  sfu:
    image: ghcr.io/frizzonje/relay-sfu:${RELAY_VERSION:-latest}
    profiles: ["sfu"]
    pull_policy: missing # see api
    # Host network instead of publishing the port range: for ~100 RTC ports
    # docker would spawn hundreds of userland proxies and push every RTP packet
    # through DNAT — real CPU cost on a small VM and one more way for media to
    # die mid-call. Same reasoning as coturn below. Signalling now listens on
    # host port 3100 — do NOT open it on the firewall (Caddy reaches it via the
    # host gateway); the RTC range 40000-40100 (UDP+TCP) is all you expose.
    network_mode: host
    restart: unless-stopped
    environment:
      - PORT=3100
      - SFU_SECRET=${SFU_SECRET:-}
      - SERVER_HOST=${SERVER_HOST:-localhost}
      # ICE candidate address. On a cloud VM behind 1:1 NAT the public IP is
      # mandatory, otherwise clients get an internal address and media dies.
      - SFU_ANNOUNCED_IP=${SFU_ANNOUNCED_IP:-${TURN_EXTERNAL_IP:-}}
      - SFU_RTC_MIN_PORT=${SFU_RTC_MIN_PORT:-40000}
      - SFU_RTC_MAX_PORT=${SFU_RTC_MAX_PORT:-40100}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      # Media-server signalling upstream: sfu lives on the host network (see
      # above), reachable from the compose network only via the host gateway.
      - SFU_UPSTREAM=host.docker.internal:3100
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # TLS-режим: пустой по умолчанию, install.sh пишет сюда issuer с профилем
      # shortlived, когда сертификат берётся на голый IP. Файл обязан
      # существовать рядом с compose — иначе docker создаст на его месте каталог
      # и Caddy откажется парсить конфиг («is a directory»). install.sh скачивает
      # его вместе с Caddyfile.
      - ./tls-mode.caddy:/etc/caddy/tls-mode.caddy:ro
      - caddy_data:/data
      - caddy_config:/config

  # TURN relay (profile: turn) — needed for calls between strict NATs (mobile,
  # CGNAT). host network so coturn sees real addresses. TURN over TLS on 5349
  # reuses Caddy's cert from the shared caddy_data volume. Firewall: open
  # 3478/udp, 3478/tcp, 5349/tcp, 49160-49200/udp.
  coturn:
    image: coturn/coturn:4-alpine
    profiles: ["turn"]
    network_mode: host
    restart: unless-stopped
    # Root: Caddy stores certs under a 0700 root dir (key 0600); coturn's default
    # `nobody` user can't read them and TLS silently falls back. Root reads as-is.
    user: "0:0"
    depends_on:
      - caddy
    environment:
      - SERVER_HOST=${SERVER_HOST:-localhost}
      - TURN_USERNAME=${TURN_USERNAME:-webrtc}
      - TURN_CREDENTIAL=${TURN_CREDENTIAL:-}
      # Секрет временных учёток TURN: api подписывает им выдачу, coturn
      # проверяет подпись. Одна переменная на обе стороны — иначе они
      # разъедутся, и разъедутся молча (см. apps/api/src/turn.ts).
      - TURN_SECRET=${TURN_SECRET:-}
      - TURN_EXTERNAL_IP=${TURN_EXTERNAL_IP:-}
    volumes:
      - caddy_data:/certs:ro
      # Точка входа вынесена в файл: она ждёт сертификат Caddy на первом старте и
      # перечитывает его при ротации (см. комментарии внутри скрипта).
      - ./coturn-entrypoint.sh:/coturn-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/coturn-entrypoint.sh"]

volumes:
  uploads:
  pgdata:
  caddy_data:
  caddy_config:
