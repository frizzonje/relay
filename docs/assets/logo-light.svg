<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 48 48" fill="none">
  <title>relay</title>
  <style>
    .hs { stroke-dasharray: 24; stroke-dashoffset: 24; opacity: 0; animation: hsEdge 3s ease infinite; }
    .n { transform-box: fill-box; transform-origin: center; animation: hsNode 3s ease infinite; }
    .ping { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ping 3s ease-out infinite; }
    .d1 { animation-delay: .55s; } .d2 { animation-delay: 1.1s; } .d3 { animation-delay: .35s; } .d4 { animation-delay: .9s; }
    @keyframes hsEdge {
      0% { stroke-dashoffset: 24; opacity: 0; } 6% { opacity: 1; }
      20% { stroke-dashoffset: 0; opacity: 1; } 40% { opacity: .9; }
      55%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes hsNode {
      0%, 24%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(12, 14, 17, 0)); }
      12% { transform: scale(1.22); filter: drop-shadow(0 0 3px rgba(12, 14, 17, .8)); }
    }
    @keyframes ping { 0% { transform: scale(1); opacity: .6; } 60%, 100% { transform: scale(2.4); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .hs, .n, .ping { animation: none; } }
  </style>
  <g stroke="#6b7079" stroke-width="1.5" stroke-linecap="round">
    <line x1="24" y1="13" x2="12.5" y2="34"/>
    <line x1="24" y1="13" x2="35.5" y2="34"/>
    <line x1="12.5" y1="34" x2="35.5" y2="34"/>
  </g>
  <g stroke="#0c0e11" stroke-width="1.5" stroke-linecap="round">
    <line class="hs" x1="24" y1="13" x2="12.5" y2="34"/>
    <line class="hs d1" x1="35.5" y1="34" x2="24" y2="13"/>
    <line class="hs d2" x1="12.5" y1="34" x2="35.5" y2="34"/>
  </g>
  <circle class="ping" cx="24" cy="13" r="6" stroke="#0c0e11" stroke-width="1"/>
  <circle class="n d3" cx="12.5" cy="34" r="5" fill="#ffffff" stroke="#2b2e33" stroke-width="1.5"/>
  <circle class="n d4" cx="35.5" cy="34" r="5" fill="#ffffff" stroke="#2b2e33" stroke-width="1.5"/>
  <circle class="n" cx="24" cy="13" r="6" fill="#0c0e11"/>
</svg>
