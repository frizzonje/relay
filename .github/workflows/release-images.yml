# Publish production api/web/sfu images to GHCR.
#
# Trigger: pushing a version tag (v0.4.0, v1.2.3) or a manual dispatch. The
# installer (install.sh) and docker-compose.prod.yml pull these images, so the
# self-host stack never builds anything on the user's server.
#
# Images:
#   ghcr.io/frizzonje/relay-api
#   ghcr.io/frizzonje/relay-web
#   ghcr.io/frizzonje/relay-sfu   (медиасервер, опциональный профиль)
#
# Tags applied: the git tag without leading "v" (0.4.0), plus "latest" for a
# release tag (v1.2.3) — but not for a prerelease (v1.0.0-rc1), not for a new
# major (v1.0.0, v2.0.0) and not for a manual dispatch unless it explicitly asks
# for it. Everything installed follows :latest, so moving it is a decision, not
# a side effect — and across a major it is a decision to be taken by hand, once
# the installed base has been given a way over (see the case below).
#
# Tag only — do NOT create a GitHub Release object for `vX.Y.Z`. The desktop
# app is released from this same repository, and its auto-updater points at
# `/releases/latest/download/latest.json`: the newest Release wins that URL, so
# a release page written for the stack would send every desktop installation
# looking for an asset that is not there. Nothing here needs one — images are
# built from the pushed tag, and the installer reads tags too (install.sh,
# `latest_release`), for exactly this reason.
#
# Shape of the pipeline: everything that can say "no" runs first and in
# parallel (gate → e2e, and the sfu smoke run alongside them), all three images
# are pushed under the version number, and only then does `promote` move
# `:latest`. That order is the point — see the job comments.
name: release-images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. 0.4.0).'
        required: true
      latest:
        description: 'Also move :latest to this build (every installation follows :latest).'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# Два релиза подряд не гоняют друг друга за `:latest`: конвейер сериализуется,
# и первый до конца доезжает, прежде чем начнётся второй (cancel-in-progress
# здесь навредил бы — прерванный релиз остаётся наполовину опубликованным).
concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  # Версия и — отдельно — решение двигать ли `:latest`. Считается один раз и
  # здесь: тем же числом пользуются и сборка, и перевод `:latest`, а
  # посчитанное в двух местах однажды разойдётся.
  meta:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      latest: ${{ steps.v.outputs.latest }}
    steps:
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_LATEST: ${{ github.event.inputs.latest }}
        run: |
          if [ "$EVENT" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
            case "$V" in
              *-*)    LATEST=false ;;   # пререлиз: публикуем под своим номером, и только
              # Мажор `:latest` НЕ двигает, и это не осторожность, а единственный
              # способ не уронить чужие серверы. Всё, что установлено до 1.0,
              # следует за `:latest` и вдобавок собрано с `pull_policy: always` —
              # то есть образ приезжает к ним на первом же `relay up`, без единой
              # команды об обновлении. А мажор меняет не только образ: 1.0 требует
              # сервиса базы, которого в их compose-файле нет и взяться ему
              # неоткуда (их `relay update` — это `docker compose pull`, файлы
              # стека он не трогает). Двинь мы `:latest` — и стек ляжет у всех
              # разом, по команде, которая годом раньше была безопасной.
              # Переход делает человек: заново прогоняет install.sh, который
              # приносит и compose с базой, и новый relay-cli (см. README,
              # «Upgrading»). Промоушен `:latest` остаётся ручным — workflow_dispatch
              # с latest=true, когда придёт время.
              *.0.0)  LATEST=false ;;
              *)      LATEST=true ;;
            esac
          else
            # Тот же срез "v", что и у тега: поле просит "0.4.0", но пишут в
            # него по привычке "v0.4.0" — и образ уехал бы под номером, за
            # которым не приходит никто.
            V="${INPUT_TAG#v}"
            LATEST="$INPUT_LATEST"
          fi
          # Номер обязан начинаться с цифры. Опечатку в ручном запуске дешевле
          # поймать здесь, чем найти в GHCR образ с именем вроде "релиз".
          case "$V" in
            [0-9]*) ;;
            *) echo "не похоже на номер версии: \"$V\"" >&2; exit 1 ;;
          esac
          echo "version=$V" >>"$GITHUB_OUTPUT"
          echo "latest=$LATEST" >>"$GITHUB_OUTPUT"
          echo "publishing $V (latest=$LATEST)"
          case "$V:$LATEST" in
            *.0.0:false)
              echo "::notice::$V — мажор: :latest остаётся на прежнем релизе."
              echo "::notice::Установленные до него инсталляции переходят через install.sh."
              ;;
          esac

  # Ворот на публикацию. CI по тегу не бежит (его триггеры — ветки и PR), так
  # что «тег на сломанном коммите» проверить больше некому, кроме самого
  # релиза: этот job перегоняет ровно то, что CI проверяет на каждой ветке, —
  # на том коммите, который сейчас уедет в GHCR (audit S9).
  gate:
    name: verify (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    # Ровно та же база, что у CI на ветках (.github/workflows/ci.yml,
    # build-test): api-тесты 1.0 разговаривают с настоящим Postgres, и без
    # него весь пакет падает на сборе — 18 файлов, ни одного проверенного
    # утверждения. Джоба, которая называет себя воротами релиза, обязана
    # запускаться на том же стенде, что и проверка ветки; расходятся они
    # молча, а замечается это на теге, когда публиковать уже пора.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_test
        options: >-
          --health-cmd "pg_isready -U relay -d relay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgresql://relay:relay@localhost:5432/relay_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # Последовательно, в отличие от CI на ветках: часть голосовых тестов
      # держится на времени и на двухъядерном раннере в параллель со сборкой
      # Next срывается (audit S8). Красный релиз обязан означать сломанный
      # код, а не занятый раннер, — за это стоит заплатить парой минут.
      - run: pnpm turbo run typecheck test build --concurrency=1

  # Интеграция — отдельно от юнит-уровня: тот же прогон, что e2e-джоба CI
  # (Playwright против поднятого прод-стека). Коммит, ломающий логин/чат/
  # загрузку на связке сервисов, юнитами не ловится, а в GHCR уезжать не должен.
  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - name: Up prod stack (e2e overlay)
        env:
          SITE_PASSWORD: testpass123
          POSTGRES_PASSWORD: testpass123
        run: docker compose -f docker-compose.yml -f infra/docker-compose.e2e.yml up -d --build
      - name: Wait for Caddy to serve the site over TLS
        run: |
          # Not a sleep: the question is whether the stand answers, and the
          # answer travels the whole way — internal certificate, site name,
          # proxy to api. A fixed pause was either too long on every green run
          # or too short on the one slow one, and the slow one looked like a
          # broken test.
          for i in $(seq 60); do
            if docker exec relay-caddy-1 wget --no-check-certificate -qO- \
                 https://relay.test/api/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Caddy never started serving https://relay.test"
          docker logs relay-caddy-1
          exit 1
      - name: Run Playwright
        run: |
          CADDY_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' relay-caddy-1)
          docker run --rm --network relay_default --add-host "relay.test:$CADDY_IP" \
            -v "$PWD":/work -w /work/e2e \
            -e BASE_URL=https://relay.test -e SITE_PASSWORD=testpass123 -e CI=1 \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            sh -c 'npm install --no-save @playwright/test@1.55.0 && npx playwright test'
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f infra/docker-compose.e2e.yml down -v

  # Единственный образ, который в этом конвейере иначе уехал бы ни разу не
  # запущенным. api и web гоняет e2e выше; sfu стоит за профилем compose, и
  # его не поднимает ни e2e, ни что-либо ещё — при этом он один запускает
  # нативный бинарник (воркер mediasoup) из-под непривилегированного
  # пользователя, пара, ломающаяся молча (audit S6). Та же проверка есть в CI
  # веток, но по тегу CI не бежит, а публикует именно этот файл.
  #
  # Зависимостей нет намеренно: джоба идёт параллельно gate и e2e и потому
  # ничего не добавляет ко времени релиза — его длина по-прежнему gate + e2e.
  sfu-smoke:
    name: sfu image boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sfu image
        run: docker build -f apps/sfu/Dockerfile -t relay-sfu:release .
      - name: Smoke-run it
        run: |
          docker run -d --name sfu-smoke -e SFU_SECRET=smoke -p 3100:3100 relay-sfu:release
          for i in $(seq 30); do
            if curl -fsS http://localhost:3100/health; then echo; break; fi
            if [ "$i" = 30 ]; then echo "sfu did not answer /health"; docker logs sfu-smoke; exit 1; fi
            sleep 1
          done
          # The owner of /proc/1 is the user the service actually runs as —
          # `id` inside exec would only echo the image's USER back at us.
          test "$(docker exec sfu-smoke stat -c %U /proc/1)" = node
          docker rm -f sfu-smoke

  # Публикация — только под номером версии. `:latest` здесь не проставляется
  # вовсе: матрица пушит три образа независимо, и падение третьего после двух
  # успешных перевело бы живые инсталляции (`pull_policy: always`) на разъехавшийся
  # набор служб. Перевод отложен в promote, до которого доходят только все трое.
  # Инсталлятор и CLI не попадают ни в один образ — они скачиваются с этого
  # самого тега. Значит, тег со сломанным `relay update` ломает обновление всем,
  # у кого оно уже настроено, и никакая проверка образов этого не поймает.
  # Идёт параллельно gate и e2e, ко времени релиза не добавляет.
  shell:
    name: installer + relay CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:stable -S warning \
            install.sh infra/relay-cli.sh infra/coturn-entrypoint.sh infra/api-entrypoint.sh infra/tests/*.sh
      - name: Test
        run: bash infra/tests/run.sh

  # То же, что и в CI веток, и по той же причине, что gate: по тегу CI не бежит.
  # Разница в цене ошибки — здесь тег уезжает в GHCR, откуда его заберут все
  # живые инсталляции разом. Заметьте, красным это может стать без единого
  # коммита: совет опубликовали против кода, который не менялся. Тогда порядок
  # обратный привычному — сперва подъём зависимости (или `pnpm.overrides`), и
  # только потом тег. Патча нет вовсе — `pnpm.auditConfig.ignoreCves`: решение,
  # которое кто-то подписал диффом. Идёт параллельно gate и e2e.
  audit:
    name: prod dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm audit --prod --audit-level=high

  build:
    name: build · push (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: [meta, gate, e2e, sfu-smoke, shell, audit]
    strategy:
      matrix:
        include:
          - app: api
            image: ghcr.io/frizzonje/relay-api
          - app: web
            image: ghcr.io/frizzonje/relay-web
          - app: sfu
            image: ghcr.io/frizzonje/relay-sfu
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          # arm64 собирается под QEMU. Для sfu это терпимо ровно потому, что
          # mediasoup выкладывает готовый бинарник воркера и под arm64-glibc —
          # если он когда-нибудь перестанет находиться, сборка уйдёт в C++ из
          # исходников под эмуляцией (часы), и arm64 придётся отцепить.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.image }}:${{ needs.meta.outputs.version }}
          # Тот же номер, что в теге образа: About сверяет его с версией
          # клиента, и разойтись они не должны из-за способа сборки.
          build-args: |
            RELAY_VERSION=${{ needs.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # За `:latest` идут все живые инсталляции, так что это не украшение тега, а
  # решение «перевести всех на этот образ» — и принимается оно одним шагом на
  # все три службы, после того как все три опубликованы.
  #
  # imagetools ничего не пересобирает: он копирует уже лежащий в реестре
  # манифест (со всеми платформами) под второе имя. Секунды, и ровно тот же
  # образ, что проверили выше, — пересборка ради тега дала бы другие байты.
  promote:
    name: move :latest
    runs-on: ubuntu-latest
    needs: [meta, build]
    if: needs.meta.outputs.latest == 'true'
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Point :latest at ${{ needs.meta.outputs.version }}
        env:
          V: ${{ needs.meta.outputs.version }}
        run: |
          for IMAGE in \
            ghcr.io/frizzonje/relay-api \
            ghcr.io/frizzonje/relay-web \
            ghcr.io/frizzonje/relay-sfu
          do
            docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$V"
            echo "$IMAGE:latest -> $V"
          done
